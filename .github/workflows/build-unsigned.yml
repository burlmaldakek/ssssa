name: Build FairPlayed Lab (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FairPlayed/**'
      - '.github/workflows/build-unsigned.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app without signing
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/Release-iphoneos build/Intermediates
          xcodebuild \
            -project FairPlayed/FairPlayed.xcodeproj \
            -target FairPlayed \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            OBJROOT="$PWD/build/Intermediates" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Release-iphoneos/FairPlayed.app"
          test -d "$APP"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/FairPlayed.app
          (cd package && /usr/bin/zip -qry "$GITHUB_WORKSPACE/FairPlayed-Lab-unsigned.ipa" Payload)
          test -s FairPlayed-Lab-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FairPlayed-Lab-unsigned-IPA
          path: FairPlayed-Lab-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
